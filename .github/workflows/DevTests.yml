name: DevTests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system tkinter
        # customtkinter imports tkinter, which isn't bundled with Python on Ubuntu.
        # Our test conftest stubs it, but installing the real thing means the stub
        # becomes a no-op and the test environment mirrors the Windows dev setup.
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml